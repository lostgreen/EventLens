data:
  train_files: ""
  val_files: ""
  prompt_key: prompt
  answer_key: answer
  video_key: videos
  image_dir: null
  video_fps: 2.0
  max_frames: 256
  min_pixels: 3136
  max_pixels: 65536
  max_prompt_length: 14000
  max_response_length: 512
  rollout_batch_size: 64
  val_batch_size: 128
  format_prompt: null
  filter_overlong_prompts: false
  shuffle: true
  seed: 1
  task_homogeneous_batching: false
  task_homogeneous_grouping: raw
  dataloader_num_workers: 16
  dataloader_prefetch_factor: 4
  dataloader_persistent_workers: true
  dataloader_pin_memory: true
algorithm:
  training_mode: rl
  adv_estimator: ema_grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 0.01
  online_filtering: false
  filter_key: accuracy
  filter_low: 0.05
  filter_high: 0.95
worker:
  actor:
    global_batch_size: 64
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 2
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    loss_avg_mode: token
    entropy_coeff: 0.005
    model:
      model_path: Qwen/Qwen3-VL-4B-Instruct
      freeze_vision_tower: true
      enable_gradient_checkpointing: true
      trust_remote_code: false
    optim:
      strategy: adamw_bf16
      lr: 5.0e-7
      weight_decay: 0.01
      lr_warmup_ratio: 0.1
      warmup_style: cosine
      min_lr_ratio: 0.1
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      torch_dtype: bf16
    offload:
      offload_params: false
      offload_optimizer: false
  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: false
  rollout:
    n: 8
    temperature: 1.0
    top_p: 0.9
    seed: 1
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.55
    max_num_batched_tokens: 20480
    max_num_seqs: 16
    enforce_eager: false
    enable_chunked_prefill: false
    disable_tqdm: true
    cot_budget_enabled: false
    cot_budget_start_token: <think>
    cot_budget_end_token: </think>
    cot_budget_max_tokens: 0
    cot_budget_repair_suffix: ""
    val_override_config:
      temperature: 0.7
      top_p: 0.95
      n: 1
  reward:
    reward_type: batch
    reward_function: verl/reward_function/mixed_proxy_reward.py:compute_score
    reward_function_kwargs:
      cot_format_reward_enabled: false
    enable_response_loss_weight_mask: false
    thought_loss_weight: 0.2
    answer_loss_weight: 1.0
    default_loss_weight: 1.0
    format_loss_weight: null
    answer_fallback_after_thought: true
trainer:
  project_name: EventLens
  experiment_name: eventlens
  logger: [file, tensorboard]
  nnodes: 1
  n_gpus_per_node: 8
  total_epochs: 1
  max_steps: null
  max_try_make_batch: 20
  val_freq: 50
  val_before_train: false
  skip_final_validation: false
  val_generations_to_log: 4
  save_freq: 50
  save_limit: -1
  save_best: false
  find_last_checkpoint: false
  save_checkpoint_path: checkpoints/eventlens
  save_rollout_to_file: true
  save_rollout_include_multimodal: true
  save_rollout_include_timeline: true
